name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - name: Install dependencies
        run: pip install -r requirements.lock pytest ruff
      - name: Lint
        run: ruff check parsers src
      - name: Test
        run: python -m pytest tests -q --ignore=tests/e2e

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: UI tests
        run: npm run test:ts
