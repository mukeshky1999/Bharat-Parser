name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies (wheels only, so no C++ compiler is ever needed)
        run: pip install --only-binary=:all: -r requirements-dev.txt
      - name: Lint
        run: ruff check parsers src
      - name: Test
        run: python -m pytest tests -q --ignore=tests/e2e

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: UI tests
        run: npm run test:ts
