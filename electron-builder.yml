appId: com.bharat.analyzer.forensics
productName: BharatAnalyzer
copyright: Copyright © 2026 Bharat-PA Forensics Team

directories:
  output: release
  buildResources: build

files:
  - "dist/**/*"
  - "electron/**/*"
  - "package.json"

extraResources:
  - from: "dist_backend/bharat_backend"
    to: "backend"
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  sign: false
  verifyUpdateCodeSignature: false
  artifactName: "${productName}-Setup-${version}.${ext}"
  legalTrademarks: "BharatAnalyzer Sovereign Forensics Suite"

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "BharatAnalyzer Forensics Suite"
  uninstallDisplayName: "BharatAnalyzer Sovereign Digital Forensics & Financial Intelligence Suite"

portable:
  artifactName: "${productName}-Portable-${version}.${ext}"
